<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>哈基米消消乐</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #5c4a3a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100dvh;
    font-family: 'Press Start 2P', system-ui, monospace;
    overflow: hidden;
    image-rendering: pixelated;
  }

  .game {
    background: #8b7355;
    max-width: min(95vw, 420px);
    width: 100%;
    aspect-ratio: 9 / 16;
    border-radius: 8px;
    border: 3px solid #6b5b45;
    box-shadow: 0 0 0 5px #4a3d2e, 0 6px 24px rgba(0,0,0,0.5);
    position: relative;
    overflow: hidden;
  }

  .page {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.4s ease, transform 0.4s ease;
    z-index: 1;
  }
  .page.hidden { opacity: 0; transform: scale(1.03); pointer-events: none; z-index: 0; }

  /* ===== 开屏 ===== */
  #page-splash {
    background: linear-gradient(180deg, #b8a080 0%, #8b7355 50%, #6b5b45 100%);
    cursor: pointer;
  }

  .title { font-size: 24px; color: #f5e6c8; text-shadow: 0 2px 0 #6b5b45; letter-spacing: 3px; margin-bottom: 2px; }
  .title .hl { color: #e8c87a; text-shadow: 0 2px 0 #8b7355; }
  .sub   { font-size: 7px; color: #c4b091; letter-spacing: 2px; margin-bottom: 30px; }

  .tap-hint { font-size: 6px; color: #8a7a65; animation: blink 1.8s ease-in-out infinite; position: absolute; bottom: 36px; text-align: center; line-height: 1.6; }
  @keyframes blink { 0%,100%{opacity:0.3} 50%{opacity:1} }

  /* 猫爪 logo */
  .logo-g { width: 72px; height: 72px; display: grid; grid-template-columns: repeat(8,1fr); grid-template-rows: repeat(8,1fr); gap: 2px; margin-bottom: 14px; }
  .logo-g .px { border-radius: 1px; }

  /* ===== 游戏页 ===== */
  #page-game { background: #6b5b45; padding: 8px; gap: 0; }

  .top-bar {
    width: 100%; padding: 6px 10px;
    background: #5c4a3a; border-radius: 4px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .top-left { text-align: left; }
  .top-left .lbl { font-size: 5px; color: #a09070; }
  .top-left .val { font-size: 9px; color: #e8c87a; }

  .top-right { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .top-right .cat { font-size: 20px; transition: font-size 0.3s; }
  .top-right .cinfo { font-size: 5px; color: #c4b091; line-height: 1.3; text-align: right; }
  .top-right .cinfo .lvl { color: #e8c87a; }

  .b-wrap { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; position: relative; margin: 6px 0; }
  .board { display: grid; grid-template-columns: repeat(6,1fr); gap: 3px; width: 92%; aspect-ratio: 1; }
  .tile {
    aspect-ratio: 1; border: 2px solid #7a6a55; border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(14px, 4.5vw, 22px); cursor: pointer;
    background: #d4c4a8; transition: 0.06s;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.15);
  }
  .tile:active { transform: scale(0.92); }
  .tile.sel { border-color: #e8c87a; box-shadow: 0 0 0 3px #e8c87a, inset 0 -2px 0 rgba(0,0,0,0.15); }

  .bot-bar { width: 100%; display: flex; gap: 5px; margin-top: 4px; }
  .btn {
    flex: 1; padding: 7px 0; border: none; border-radius: 3px;
    font-family: 'Press Start 2P', monospace; font-size: 5px; color: #f5e6c8;
    cursor: pointer; background: #5c4a3a; transition: 0.06s;
    box-shadow: inset 0 -2px 0 #3d3025;
  }
  .btn:active { transform: translateY(2px); box-shadow: none; }

  /* ===== 设置页 ===== */
  #page-settings { background: #6b5b45; padding: 24px 20px; justify-content: flex-start; padding-top: 32px; }

  .set-title { font-size: 14px; color: #f5e6c8; text-shadow: 0 2px 0 #5c4a3a; margin-bottom: 20px; }

  .set-group { width: 100%; margin-bottom: 16px; }
  .set-label { font-size: 7px; color: #c4b091; margin-bottom: 6px; }
  .set-row { display: flex; gap: 6px; }
  .set-opt {
    flex: 1; padding: 8px 0; border: 2px solid #7a6a55; border-radius: 3px;
    background: #5c4a3a; color: #c4b091; text-align: center;
    font-family: 'Press Start 2P', monospace; font-size: 6px; cursor: pointer; transition: 0.1s;
  }
  .set-opt.active { border-color: #e8c87a; background: #4a3d2e; color: #e8c87a; }

  .set-slider { width: 100%; -webkit-appearance: none; appearance: none; height: 6px; background: #4a3d2e; border-radius: 3px; outline: none; margin: 10px 0; }
  .set-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: #e8c87a; border-radius: 2px; cursor: pointer; border: 2px solid #c4b091; }

  .set-hint { font-size: 5px; color: #8a7a65; margin-top: 2px; }

  .set-btn {
    width: 100%; padding: 12px 0; border: none; border-radius: 3px;
    font-family: 'Press Start 2P', monospace; font-size: 8px; color: #f5e6c8;
    cursor: pointer; background: #e8c87a; color: #4a3d2e; margin-top: 8px;
    box-shadow: inset 0 -3px 0 #b89a50;
  }
  .set-btn:active { transform: translateY(2px); box-shadow: none; }

  .back-btn {
    width: 100%; padding: 10px 0; border: none; border-radius: 3px; margin-top: 8px;
    font-family: 'Press Start 2P', monospace; font-size: 6px; color: #c4b091;
    cursor: pointer; background: #4a3d2e; box-shadow: inset 0 -2px 0 #3d3025;
  }
  .back-btn:active { transform: translateY(2px); box-shadow: none; }

  .ver-info { font-size: 5px; color: #8a7a65; margin-top: 14px; }

  /* ===== 猫舍 ===== */
  #page-cattery { background: #6b5b45; padding: 20px 16px; justify-content: flex-start; padding-top: 28px; }
  .cat-title { font-size: 14px; color: #f5e6c8; text-shadow: 0 2px 0 #5c4a3a; margin-bottom: 2px; }
  .cat-sub { font-size: 5px; color: #8a7a65; margin-bottom: 16px; }

  .cat-list { width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .cat-card { display: flex; align-items: center; gap: 10px; background: #5c4a3a; border-radius: 4px; padding: 10px; border: 2px solid #7a6a55; }
  .cat-card:nth-child(1) { border-color: #e8c87a; }
  .cat-card:nth-child(2) { border-color: #b0a090; }
  .cat-card:nth-child(3) { border-color: #8a7a65; }
  .cat-card .rk { font-size: 12px; width: 22px; text-align: center; }
  .cat-card .ct { font-size: 24px; transition: font-size 0.3s; }
  .cat-card .ci { flex: 1; }
  .cat-card .ci .nm { font-size: 6px; color: #f5e6c8; margin-bottom: 1px; }
  .cat-card .ci .st { font-size: 4px; color: #8a7a65; }
  .cat-card .ci .bar-w { margin-top: 3px; height: 3px; background: #4a3d2e; border-radius: 2px; overflow: hidden; }
  .cat-card .ci .bar { height: 100%; background: #e8c87a; border-radius: 2px; }

  .bb { margin-top: 16px; width: 100%; padding: 10px 0; border: none; border-radius: 3px; font-family: 'Press Start 2P',monospace; font-size: 6px; color: #c4b091; cursor: pointer; background: #4a3d2e; box-shadow: inset 0 -2px 0 #3d3025; }
  .bb:active { transform: translateY(2px); box-shadow: none; }

  /* ===== 钓鱼动画 ===== */
  .fish-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 5; opacity: 0; transition: opacity 0.3s; }
  .fish-overlay.active { opacity: 1; }
  .water { position: absolute; bottom: 0; left: 0; right: 0; height: 30%; background: linear-gradient(180deg,transparent,#3a6b5c 40%,#2d5a4a); }
  .ws { position: absolute; bottom: 30%; left: 0; right: 0; height: 4px; background: #5a8a7a; opacity: 0.4; border-radius: 50%; }
  .fl { position: absolute; top: 0; left: 50%; width: 1px; height: 0; background: #a09070; transform: translateX(-50%); transition: height 0.5s ease; }
  .fl.d { height: 48%; }
  .bbob { position: absolute; top: 0; left: 50%; width: 8px; height: 8px; background: #c4785a; border-radius: 50%; transform: translate(-50%,-50%); transition: top 0.5s ease; }
  .bbob.d { top: 48%; }
  .spr { position: absolute; bottom: 30%; left: 50%; width: 0; height: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); transform: translate(-50%,50%); opacity: 0; }
  .spr.a { width: 32px; height: 16px; opacity: 1; transition: width 0.35s ease, height 0.35s ease, opacity 0.25s; }
  .fc { position: absolute; top: 48%; left: 50%; font-size: 18px; transform: translate(-50%,-50%) scale(0); transition: transform 0.25s ease; }
  .fc.c { transform: translate(-50%,-50%) scale(1); }
  .fc.r { transition: top 0.4s ease, transform 0.25s ease; top: 18%; }
  .fc.g { opacity: 0; transition: opacity 0.15s; }
  .ft { position: absolute; top: 38%; left: 50%; font-size: 7px; color: #e8c87a; transform: translate(-50%,-50%) scale(0); text-shadow: 0 0 4px rgba(232,200,122,0.5); }
  .ft.s { transform: translate(-50%,-50%) scale(1); transition: transform 0.25s ease; }
  .ch { position: absolute; right: 8%; bottom: 4%; font-size: 7px; color: #f5e6c8; opacity: 0; transition: 0.25s; }
  .ch.s { opacity: 1; transform: translateY(-6px); transition: 0.35s; }

  /* ===== 猫尺寸 ===== */
  .cxs { font-size: 14px; } .csm { font-size: 18px; } .cmd { font-size: 22px; } .clg { font-size: 28px; } .cxl { font-size: 34px; } .cxx { font-size: 40px; }
</style>
</head>
<body>

<div class="game" id="app">

<!-- ==================== 开屏 ==================== -->
<div class="page" id="page-splash">
  <div class="logo-g" id="logoG"></div>
  <div class="title">哈基米<br><span class="hl">消消乐</span></div>
  <div class="sub">找到一对 · 喂饱小猫</div>
  <div class="tap-hint">👆 轻触开始<br><span style="font-size:4px">钓一条鱼 · 猫就大一分</span></div>
</div>

<!-- ==================== 游戏 ==================== -->
<div class="page hidden" id="page-game">
  <div class="top-bar">
    <div class="top-left">
      <div class="lbl">分数</div>
      <div class="val" id="sc">0</div>
    </div>
    <div class="top-right" id="catBtn">
      <div><span style="font-size:5px;color:#c4b091" id="fishC">0</span><span style="font-size:6px;margin-left:2px">🐟</span></div>
      <div class="cat" id="gci">🐱</div>
      <div class="cinfo"><span id="cnm">咪咪</span><br><span class="lvl" id="clvl">Lv.1</span></div>
    </div>
  </div>

  <div class="b-wrap">
    <div class="board" id="board"></div>
    <div class="fish-overlay" id="fo">
      <div class="water"></div><div class="ws"></div>
      <div class="fl" id="fl"></div><div class="bbob" id="bbob"></div>
      <div class="spr" id="spr"></div>
      <div class="fc" id="fc">🐟</div>
      <div class="ft" id="ft">🐱 好吃！</div>
      <div class="ch" id="ch">😸 喵~</div>
    </div>
  </div>

  <div class="bot-bar">
    <button class="btn" id="bHint">💡提示</button>
    <button class="btn" id="bReset">↺重开</button>
    <button class="btn" id="bSet">⚙设置</button>
    <button class="btn" id="bCat">🏠猫舍</button>
  </div>
</div>

<!-- ==================== 设置 ==================== -->
<div class="page hidden" id="page-settings">
  <div class="set-title">⚙ 设置</div>

  <div class="set-group">
    <div class="set-label">⏱ 时间限制</div>
    <div class="set-row" id="timeOpts">
      <div class="set-opt" data-v="60">60s</div>
      <div class="set-opt active" data-v="120">120s</div>
      <div class="set-opt" data-v="180">180s</div>
      <div class="set-opt" data-v="-1">∞</div>
    </div>
  </div>

  <div class="set-group">
    <div class="set-label">🎯 难度</div>
    <input type="range" class="set-slider" id="diffSlider" min="3" max="6" value="4" step="1">
    <div class="set-hint" id="diffHint">中等 · 4×4 网格</div>
  </div>

  <div class="set-group">
    <div class="set-label">🔊 音效</div>
    <div class="set-row" id="soundOpts">
      <div class="set-opt active" data-v="on">开</div>
      <div class="set-opt" data-v="off">关</div>
    </div>
  </div>

  <button class="set-btn">🔄 重新开始</button>
  <button class="back-btn" id="bBack">↩ 返回游戏</button>
  <div class="ver-info">🀄 哈基米消消乐 v1.0 · Java Swing</div>
</div>

<!-- ==================== 猫舍 ==================== -->
<div class="page hidden" id="page-cattery">
  <div class="cat-title">🏠 猫舍</div>
  <div class="cat-sub">猫越肥越厉害</div>
  <div class="cat-list" id="catList"></div>
  <button class="bb" id="bBack2">↩ 回去钓鱼</button>
</div>

</div>

<script>
  // ===== 猫爪 Logo =====
  const lg = document.getElementById('logoG');
  for (let i = 0; i < 64; i++) { const px = document.createElement('div'); px.className = 'px'; lg.appendChild(px); }
  const pa = [27,28,35,36,5,6,13,14,9,10,17,18,11,12,19,20,41,42,49,50,45,46,53,54];
  const de = [2,7,15,22,23,30,31,38,39,58,61];
  const ap = lg.querySelectorAll('.px');
  pa.forEach(i => ap[i].style.background = '#e8dcc0');
  de.forEach(i => { if (ap[i]) ap[i].style.background = '#c4b091'; });

  // ===== 状态 =====
  const EMOJIS = ['🍣','🍙','🥟','🧁','🍩','🍪','🥕','🧀','🍎','🍤','🥚','🍇'];
  const R=6,C=6; let board=[], sel=null, score=0, clv=1, ff=0;
  const cnm='咪咪', csz=['🐱','🐱','🐈','🐈','🐅','🐅','🐱‍👤','🐱‍👤','🦁','🦁'];
  const cln=['小奶猫','小奶猫','肥猫','肥猫','大胖猫','小老虎','小老虎','虎王','狮王','猫中之神'];

  function gb() { const t=R*C,p=[]; for(let i=0;i<t/2;i++) p.push(EMOJIS[i%EMOJIS.length],EMOJIS[i%EMOJIS.length]); for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]} return p.map((e,i)=>({emoji:e,rm:false,r:Math.floor(i/C),c:i%C})); }

  function rb() {
    const el=document.getElementById('board'); el.innerHTML='';
    board.forEach((c,i)=>{
      const d=document.createElement('div'); d.className='tile'; d.dataset.i=i;
      if(c.rm){d.style.visibility='hidden';d.style.pointerEvents='none'}
      if(sel===i)d.classList.add('sel');
      d.textContent=c.rm?'':c.emoji;
      d.addEventListener('click',()=>ht(i));
      el.appendChild(d);
    }); ui();
  }

  function ht(i) {
    if(board[i].rm)return;
    if(sel===null){sel=i;rb();return}
    if(sel===i){sel=null;rb();return}
    const a=board[sel],b=board[i];
    if(a.emoji===b.emoji){a.rm=true;b.rm=true;sel=null;rb();fsh()}
    else{sel=null;rb()}
  }

  function fsh() {
    const o=document.getElementById('fo'),fl=document.getElementById('fl'),bb=document.getElementById('bbob'),
          sp=document.getElementById('spr'),fc=document.getElementById('fc'),ft=document.getElementById('ft'),
          ch=document.getElementById('ch');
    o.classList.add('active');
    setTimeout(()=>{fl.classList.add('d');bb.classList.add('d')},80);
    setTimeout(()=>sp.classList.add('a'),500);
    setTimeout(()=>{sp.classList.remove('a');fc.classList.add('c');fc.textContent=['🐟','🐠','🐡','🦐','🦀','🐙'][Math.floor(Math.random()*6)]},900);
    setTimeout(()=>{fc.classList.add('r');fl.classList.remove('d');bb.classList.remove('d')},1300);
    setTimeout(()=>{fc.classList.add('g');ft.classList.add('s');score+=100;ff++;const ol=clv;clv=Math.min(10,1+Math.floor(ff/3));ui();const ci=document.getElementById('gci');ci.style.transform='scale(1.2)';setTimeout(()=>ci.style.transform='scale(1)',200)},1800);
    setTimeout(()=>{ft.classList.remove('s');ch.classList.add('s');ch.textContent=['😸 好吃！','😻 鱼！','😽 还要~','🐈 呼噜'][Math.floor(Math.random()*4)]},2200);
    setTimeout(()=>{ch.classList.remove('s');o.classList.remove('active');fl.classList.remove('d');bb.classList.remove('d');fc.classList.remove('c','r','g');ft.classList.remove('s')},3000);
  }

  function ui() {
    const sz=clv<=2?'cxs':clv<=4?'csm':clv<=5?'cmd':clv<=7?'clg':clv<=9?'cxl':'cxx';
    const ci=document.getElementById('gci');
    ci.textContent=csz[clv-1]||'🐱';ci.className='cat '+sz;
    document.getElementById('clvl').textContent='Lv.'+clv+' '+cln[clv-1];
    document.getElementById('fishC').textContent=ff;
    document.getElementById('sc').textContent=score;
  }

  // ===== 猫舍 =====
  function oc() {
    document.getElementById('page-game').classList.add('hidden');
    document.getElementById('page-cattery').classList.remove('hidden');
    const ls=document.getElementById('catList'); ls.innerHTML='';
    const cats=[{name:cnm,level:clv,fish:ff,score:score,mine:true},
      {name:'胖虎',level:Math.min(10,clv+Math.floor(Math.random()*3)),fish:ff+Math.floor(Math.random()*10),score:score+Math.floor(Math.random()*1000)},
      {name:'大橘',level:Math.min(10,clv+Math.floor(Math.random()*4)-1),fish:ff+Math.floor(Math.random()*8),score:score+Math.floor(Math.random()*800)-300},
      {name:'黑豹',level:Math.min(10,clv+Math.floor(Math.random()*5)-2),fish:ff+Math.floor(Math.random()*15),score:score+Math.floor(Math.random()*1200)-500},
      {name:'小白',level:Math.min(10,clv+Math.floor(Math.random()*2)+1),fish:ff+Math.floor(Math.random()*5),score:score+Math.floor(Math.random()*600)+100}]
      .sort((a,b)=>b.score-a.score);
    cats.forEach((c,i)=>{
      const s=c.level<=2?'cxs':c.level<=4?'csm':c.level<=5?'cmd':c.level<=7?'clg':c.level<=9?'cxl':'cxx';
      const card=document.createElement('div');card.className='cat-card';
      const md=['🥇','🥈','🥉'];
      card.innerHTML=`<div class="rk">${i<3?md[i]:'#'+(i+1)}</div><div class="ct ${s}">${csz[c.level-1]||'🐱'}</div><div class="ci"><div class="nm">${c.mine?'⭐ ':''}${c.name}</div><div class="st">Lv.${c.level} · 🐟${c.fish}条 · ${c.score}分</div><div class="bar-w"><div class="bar" style="width:${c.level*10}%"></div></div></div>`;
      ls.appendChild(card);
    });
  }

  // ===== 设置页 =====
  document.getElementById('bSet').addEventListener('click',()=>{
    document.getElementById('page-game').classList.add('hidden');
    document.getElementById('page-settings').classList.remove('hidden');
  });
  document.getElementById('bBack').addEventListener('click',()=>{
    document.getElementById('page-settings').classList.add('hidden');
    document.getElementById('page-game').classList.remove('hidden');
  });

  // 时间选项
  document.querySelectorAll('#timeOpts .set-opt').forEach(el=>{
    el.addEventListener('click',()=>{
      document.querySelectorAll('#timeOpts .set-opt').forEach(e=>e.classList.remove('active'));
      el.classList.add('active');
    });
  });

  // 难度滑条
  const ds=document.getElementById('diffSlider');
  const dh=document.getElementById('diffHint');
  const dnames=['简单 3×3','偏易 3×4','中等 4×4','较难 4×6'];
  ds.addEventListener('input',()=>{dh.textContent=dnames[ds.value-3]||'自定义'});

  // 音效
  document.querySelectorAll('#soundOpts .set-opt').forEach(el=>{
    el.addEventListener('click',()=>{
      document.querySelectorAll('#soundOpts .set-opt').forEach(e=>e.classList.remove('active'));
      el.classList.add('active');
    });
  });

  document.getElementById('bBack2').addEventListener('click',()=>{
    document.getElementById('page-cattery').classList.add('hidden');
    document.getElementById('page-game').classList.remove('hidden');
  });

  document.getElementById('catBtn').addEventListener('click',oc);
  document.getElementById('bCat').addEventListener('click',oc);

  document.getElementById('page-splash').addEventListener('click',()=>{
    document.getElementById('page-splash').classList.add('hidden');
    document.getElementById('page-game').classList.remove('hidden');
  });

  document.getElementById('bReset').addEventListener('click',()=>{board=gb();sel=null;rb()});
  document.getElementById('bHint').addEventListener('click',()=>{
    const a=board.filter(c=>!c.rm);
    if(a.length>=2){const x=a[0],y=a.find(c=>c!==x&&c.emoji===x.emoji);if(y)alert(`试试消掉 ${x.emoji} 和 ${y.emoji}`);else alert('换个位置试试~')}
  });

  board=gb();rb();
</script>
</body>
</html>
