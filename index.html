<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>哈基米消消乐 · 开屏</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #2d1b2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100dvh;
    font-family: 'Press Start 2P', system-ui, monospace;
    overflow: hidden;
    image-rendering: pixelated;
  }

  .game {
    background: #3d2438;
    max-width: min(95vw, 420px);
    width: 100%;
    aspect-ratio: 9 / 16;
    border-radius: 12px;
    border: 3px solid #e8a87c;
    box-shadow: 0 0 0 6px #2d1b2e, 0 8px 32px rgba(0,0,0,0.6);
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }

  /* ===== 开屏页 ===== */
  .screen-splash {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #c9785a 0%, #3d2438 60%, #2d1b2e 100%);
    transition: opacity 0.6s ease, transform 0.6s ease;
    z-index: 2;
  }
  .screen-splash.hidden {
    opacity: 0;
    transform: scale(1.05);
    pointer-events: none;
  }

  /* ===== Logo: 像素猫爪 ===== */
  .logo {
    width: 96px;
    height: 96px;
    margin-bottom: 18px;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    gap: 2px;
  }
  .px {
    border-radius: 1px;
  }
  /* 猫爪图案 — 肉垫暗色，底色透明 */
  .logo .px  { background: transparent; }
  /* 主肉垫（中间大圆） */
  .logo .px:nth-child(28) { background: #f5d9c4; }
  .logo .px:nth-child(29) { background: #f5d9c4; }
  .logo .px:nth-child(36) { background: #f5d9c4; }
  .logo .px:nth-child(37) { background: #f5d9c4; }
  /* 四个小肉垫 */
  .logo .px:nth-child(6)  { background: #f5d9c4; }
  .logo .px:nth-child(7)  { background: #f5d9c4; }
  .logo .px:nth-child(10) { background: #f5d9c4; }
  .logo .px:nth-child(11) { background: #f5d9c4; }
  .logo .px:nth-child(22) { background: #f5d9c4; }
  .logo .px:nth-child(23) { background: #f5d9c4; }
  .logo .px:nth-child(26) { background: #f5d9c4; }
  .logo .px:nth-child(27) { background: #f5d9c4; }
  .logo .px:nth-child(42) { background: #f5d9c4; }
  .logo .px:nth-child(43) { background: #f5d9c4; }
  .logo .px:nth-child(46) { background: #f5d9c4; }
  .logo .px:nth-child(47) { background: #f5d9c4; }
  /* 一些装饰点 */
  .logo .px:nth-child(5)  { background: #e8a87c; }
  .logo .px:nth-child(12) { background: #e8a87c; }
  .logo .px:nth-child(21) { background: #e8a87c; }
  .logo .px:nth-child(14) { background: #e8a87c; }
  .logo .px:nth-child(51) { background: #e8a87c; }
  .logo .px:nth-child(52) { background: #e8a87c; }
  .logo .px:nth-child(59) { background: #e8a87c; }
  .logo .px:nth-child(60) { background: #e8a87c; }

  /* 猫耳朵在头顶 */
  .ear {
    position: absolute;
    width: 28px; height: 28px;
    background: #3d2438;
    top: -8px; z-index: 3;
    border-radius: 2px;
  }
  .ear-l { left: 30%; transform: rotate(-20deg); border-left: 3px solid #e8a87c; border-top: 3px solid #e8a87c; }
  .ear-r { right: 30%; transform: rotate(20deg); border-right: 3px solid #e8a87c; border-top: 3px solid #e8a87c; }

  /* ===== 标题 ===== */
  .title-wrap {
    position: relative;
    margin-bottom: 8px;
  }
  .title {
    font-size: 26px;
    color: #fce4d6;
    text-shadow: 0 0 12px rgba(232,168,124,0.4), 0 3px 0 #a05a3a;
    letter-spacing: 4px;
    line-height: 1.4;
    text-align: center;
  }
  .title .highlight {
    color: #f5c518;
    text-shadow: 0 0 12px rgba(245,197,24,0.5), 0 3px 0 #b8860b;
  }
  .subtitle {
    font-size: 7px;
    color: #d4a89a;
    letter-spacing: 3px;
    margin-bottom: 50px;
  }

  /* 喵叫装饰 */
  .meow-bubble {
    position: absolute;
    top: 28%;
    right: 12%;
    font-size: 14px;
    color: #fce4d6;
    opacity: 0.3;
    animation: floatBubble 3s ease-in-out infinite;
  }
  @keyframes floatBubble {
    0%, 100% { transform: translateY(0) rotate(-5deg); opacity: 0.3; }
    50%      { transform: translateY(-8px) rotate(-10deg); opacity: 0.6; }
  }

  /* ===== 轻触提示 ===== */
  .tap-hint {
    font-size: 7px;
    color: #a0766a;
    animation: blink 1.5s ease-in-out infinite;
    position: absolute;
    bottom: 40px;
    text-align: center;
  }
  @keyframes blink {
    0%, 100% { opacity: 0.3; }
    50%      { opacity: 1; }
  }

  /* ===== 漂浮小鱼干 ===== */
  .float-fish {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .fish {
    position: absolute;
    font-size: 16px;
    animation: floatUp linear infinite;
    opacity: 0.12;
  }
  .fish:nth-child(1)  { left: 10%;  animation-duration: 9s; animation-delay: 0s; }
  .fish:nth-child(2)  { left: 30%;  animation-duration: 11s; animation-delay: 2s; }
  .fish:nth-child(3)  { left: 50%;  animation-duration: 8s; animation-delay: 1s; }
  .fish:nth-child(4)  { left: 70%;  animation-duration: 10s; animation-delay: 3s; }
  .fish:nth-child(5)  { left: 85%;  animation-duration: 9s; animation-delay: 0.5s; }
  .fish:nth-child(6)  { left: 20%;  animation-duration: 12s; animation-delay: 4s; }
  .fish:nth-child(7)  { left: 60%;  animation-duration: 8s; animation-delay: 2.5s; }
  .fish:nth-child(8)  { left: 40%;  animation-duration: 10s; animation-delay: 1.8s; }

  @keyframes floatUp {
    0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.12; }
    90%  { opacity: 0.12; }
    100% { transform: translateY(-60px) rotate(360deg); opacity: 0; }
  }

  /* ===== 登录页 ===== */
  .screen-login {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #3d2438 0%, #2d1b2e 100%);
    z-index: 1;
    transition: opacity 0.6s ease;
  }
  .screen-login.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .login-box {
    background: #4a2e44;
    border-radius: 8px;
    padding: 30px 24px;
    width: min(80%, 280px);
    border: 2px solid #e8a87c;
    position: relative;
  }
  .login-box::before {
    content: "🐱";
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 24px;
  }
  .login-box h2 {
    color: #fce4d6;
    font-size: 9px;
    text-align: center;
    margin-bottom: 20px;
    letter-spacing: 2px;
  }
  .login-input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 10px;
    background: #2d1b2e;
    border: 2px solid #4a2e44;
    border-radius: 4px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: #fce4d6;
    outline: none;
  }
  .login-input:focus {
    border-color: #e8a87c;
  }
  .login-input::placeholder {
    color: #6d4c5e;
  }
  .login-row {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }
  .login-btn {
    flex: 1;
    padding: 10px 0;
    border: none;
    border-radius: 4px;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: #fff;
    cursor: pointer;
    border-bottom: 3px solid rgba(0,0,0,0.3);
    transition: 0.08s;
  }
  .login-btn:active {
    transform: translateY(2px);
    border-bottom-width: 1px;
  }
  .btn-login  { background: #c9785a; }
  .btn-reg    { background: #5d3a56; }
</style>
</head>
<body>

<div class="game" id="app">

  <!-- 猫耳朵 -->
  <div class="ear ear-l"></div>
  <div class="ear ear-r"></div>

  <!-- 漂浮小鱼干 -->
  <div class="float-fish">
    <div class="fish">🐟</div><div class="fish">🐟</div>
    <div class="fish">🐟</div><div class="fish">🐟</div>
    <div class="fish">🐟</div><div class="fish">🐟</div>
    <div class="fish">🐟</div><div class="fish">🐟</div>
  </div>

  <!-- ====== 开屏页 ====== -->
  <div class="screen-splash" id="splash">

    <!-- 像素猫爪 Logo -->
    <div class="logo" id="logo"></div>

    <div class="title-wrap">
      <div class="title">哈基米<br><span class="highlight">消消乐</span></div>
      <div class="meow-bubble">🐱 喵 ~</div>
    </div>
    <div class="subtitle">找到一对 · 喂饱小猫</div>

    <div class="tap-hint">
      👆 轻触开始<br>
      <span style="font-size:6px; opacity:0.5">哈基米哈基米~</span>
    </div>
  </div>

  <!-- ====== 登录页 ====== -->
  <div class="screen-login hidden" id="login">
    <div class="login-box">
      <h2>✦ 欢迎回来铲屎官 ✦</h2>
      <input class="login-input" type="text"     placeholder="账号" id="username">
      <input class="login-input" type="password" placeholder="密码" id="password">
      <div class="login-row">
        <button class="login-btn btn-login">进猫窝</button>
        <button class="login-btn btn-reg">新猫入住</button>
      </div>
    </div>
  </div>

</div>

<script>
  // 用 JS 绘制像素猫爪（8×8）
  const logo = document.getElementById('logo');
  for (let i = 0; i < 64; i++) {
    const px = document.createElement('div');
    px.className = 'px';
    logo.appendChild(px);
  }

  // 配成猫爪形的像素
  const pawPixels = [
    // 主肉垫（中心）
    27,28,35,36,
    // 左小肉垫
    5,6,13,14,
    // 上小肉垫
    9,10,17,18,
    // 右小肉垫
    11,12,19,20,
    // 下左
    41,42,49,50,
    // 下右
    45,46,53,54,
  ];
  const allPx = logo.querySelectorAll('.px');
  pawPixels.forEach(i => { allPx[i].style.background = '#f5d9c4'; });
  // 装饰/爪尖
  [2,7,15,22,23,30,31,38,39,58,61].forEach(i => {
    if (allPx[i]) allPx[i].style.background = '#e8a87c';
  });

  // 交互
  const splash = document.getElementById('splash');
  const login  = document.getElementById('login');

  splash.addEventListener('click', () => {
    splash.classList.add('hidden');
    login.classList.remove('hidden');
  });

  document.querySelector('.btn-login').addEventListener('click', () => {
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();
    if (!u || !p) { alert('请输入账号和密码 🐱'); return; }
    alert(`欢迎回窝，${u}！🐾`);
  });
  document.querySelector('.btn-reg').addEventListener('click', () => {
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();
    if (!u || !p) { alert('请输入账号和密码 🐱'); return; }
    alert(`新成员 ${u} 入住猫窝！🎉`);
  });
</script>
</body>
</html>
