<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>连城 · 开屏</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100dvh;
    font-family: 'Press Start 2P', system-ui, monospace;
    overflow: hidden;
    image-rendering: pixelated;
  }

  /* ===== 游戏容器 ===== */
  .game {
    background: #16213e;
    max-width: min(95vw, 420px);
    width: 100%;
    aspect-ratio: 9 / 16;
    border-radius: 12px;
    border: 3px solid #0f3460;
    box-shadow: 0 0 0 6px #1a1a2e, 0 8px 32px rgba(0,0,0,0.6);
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }

  /* ===== 开屏页 #1 ===== */
  .screen-splash {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #0f3460 0%, #16213e 60%, #1a1a2e 100%);
    transition: opacity 0.6s ease, transform 0.6s ease;
    z-index: 2;
  }
  .screen-splash.hidden {
    opacity: 0;
    transform: scale(1.05);
    pointer-events: none;
  }

  /* ===== Logo ===== */
  .logo {
    position: relative;
    width: 120px;
    height: 120px;
    margin-bottom: 20px;
  }
  .logo-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 4px;
    width: 100%;
    height: 100%;
  }
  .logo-tile {
    border-radius: 2px;
    border: 1px solid rgba(255,255,255,0.15);
    animation: tilePulse 2s ease-in-out infinite;
  }
  /* 配成一对一对的 */
  .logo-tile:nth-child(1)  { background: #e94560; animation-delay: 0.0s; }
  .logo-tile:nth-child(2)  { background: #e94560; animation-delay: 0.0s; }
  .logo-tile:nth-child(3)  { background: #f5c518; animation-delay: 0.2s; }
  .logo-tile:nth-child(4)  { background: #f5c518; animation-delay: 0.2s; }
  .logo-tile:nth-child(5)  { background: #48dbfb; animation-delay: 0.4s; }
  .logo-tile:nth-child(6)  { background: #48dbfb; animation-delay: 0.4s; }
  .logo-tile:nth-child(7)  { background: #ff9ff3; animation-delay: 0.6s; }
  .logo-tile:nth-child(8)  { background: #ff9ff3; animation-delay: 0.6s; }
  .logo-tile:nth-child(9)  { background: #54a0ff; animation-delay: 0.8s; }
  .logo-tile:nth-child(10) { background: #54a0ff; animation-delay: 0.8s; }
  .logo-tile:nth-child(11) { background: #2ed573; animation-delay: 1.0s; }
  .logo-tile:nth-child(12) { background: #2ed573; animation-delay: 1.0s; }
  .logo-tile:nth-child(13) { background: #f368e0; animation-delay: 1.2s; }
  .logo-tile:nth-child(14) { background: #f368e0; animation-delay: 1.2s; }
  .logo-tile:nth-child(15) { background: #ff6348; animation-delay: 1.4s; }
  .logo-tile:nth-child(16) { background: #ff6348; animation-delay: 1.4s; }

  @keyframes tilePulse {
    0%, 100% { opacity: 0.6; transform: scale(0.9); }
    50%      { opacity: 1;   transform: scale(1.0); }
  }

  /* ===== 游戏标题 ===== */
  .title {
    font-size: 38px;
    color: #f5c518;
    text-shadow: 0 0 10px rgba(245,197,24,0.5), 0 4px 0 #b8860b;
    letter-spacing: 8px;
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: 9px;
    color: #8899aa;
    letter-spacing: 2px;
    margin-bottom: 40px;
  }

  /* ===== 底部提示 ===== */
  .tap-hint {
    font-size: 8px;
    color: #556677;
    animation: blink 1.5s ease-in-out infinite;
    position: absolute;
    bottom: 40px;
  }
  .tap-hint span {
    display: inline-block;
    margin-right: 6px;
  }
  @keyframes blink {
    0%, 100% { opacity: 0.3; }
    50%      { opacity: 1; }
  }

  /* 漂浮的装饰棋子 */
  .float-tiles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .float-tile {
    position: absolute;
    width: 28px;
    height: 28px;
    border-radius: 3px;
    border: 2px solid rgba(255,255,255,0.08);
    animation: floatUp linear infinite;
    opacity: 0.15;
  }
  .float-tile:nth-child(1)  { left: 10%;  background: #e94560; animation-duration: 8s; animation-delay: 0s;  }
  .float-tile:nth-child(2)  { left: 25%;  background: #f5c518; animation-duration: 10s; animation-delay: 1s; }
  .float-tile:nth-child(3)  { left: 45%;  background: #48dbfb; animation-duration: 7s; animation-delay: 0.5s; }
  .float-tile:nth-child(4)  { left: 65%;  background: #ff9ff3; animation-duration: 9s; animation-delay: 2s; }
  .float-tile:nth-child(5)  { left: 80%;  background: #2ed573; animation-duration: 11s; animation-delay: 1.5s; }
  .float-tile:nth-child(6)  { left: 35%;  background: #f368e0; animation-duration: 8s; animation-delay: 3s; }
  .float-tile:nth-child(7)  { left: 55%;  background: #ff6348; animation-duration: 10s; animation-delay: 0.8s; }
  .float-tile:nth-child(8)  { left: 15%;  background: #54a0ff; animation-duration: 9s; animation-delay: 2.5s; }

  @keyframes floatUp {
    0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.15; }
    90%  { opacity: 0.15; }
    100% { transform: translateY(-60px) rotate(360deg); opacity: 0; }
  }

  /* ===== 登录页 #2 ===== */
  .screen-login {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #16213e;
    z-index: 1;
    transition: opacity 0.6s ease;
  }
  .screen-login.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .login-box {
    background: #0f3460;
    border-radius: 8px;
    padding: 30px 24px;
    width: min(80%, 280px);
    border: 2px solid #1a1a2e;
  }
  .login-box h2 {
    color: #f5c518;
    font-size: 10px;
    text-align: center;
    margin-bottom: 20px;
    letter-spacing: 2px;
  }
  .login-input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 10px;
    background: #1a1a2e;
    border: 2px solid #0f3460;
    border-radius: 4px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: #e0e0e0;
    outline: none;
  }
  .login-input:focus {
    border-color: #e94560;
  }
  .login-input::placeholder {
    color: #445566;
  }
  .login-row {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }
  .login-btn {
    flex: 1;
    padding: 10px 0;
    border: none;
    border-radius: 4px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: #fff;
    cursor: pointer;
    border-bottom: 3px solid rgba(0,0,0,0.3);
    transition: 0.08s;
  }
  .login-btn:active {
    transform: translateY(2px);
    border-bottom-width: 1px;
  }
  .btn-login  { background: #e94560; }
  .btn-reg    { background: #533483; }
</style>
</head>
<body>

<div class="game" id="app">

  <!-- 浮动的装饰棋子 -->
  <div class="float-tiles">
    <div class="float-tile"></div><div class="float-tile"></div>
    <div class="float-tile"></div><div class="float-tile"></div>
    <div class="float-tile"></div><div class="float-tile"></div>
    <div class="float-tile"></div><div class="float-tile"></div>
  </div>

  <!-- ====== 开屏页 ====== -->
  <div class="screen-splash" id="splash">
    <!-- 像素风 Logo：4×4 配对色块 -->
    <div class="logo">
      <div class="logo-grid">
        <div class="logo-tile"></div><div class="logo-tile"></div>
        <div class="logo-tile"></div><div class="logo-tile"></div>
        <div class="logo-tile"></div><div class="logo-tile"></div>
        <div class="logo-tile"></div><div class="logo-tile"></div>
        <div class="logo-tile"></div><div class="logo-tile"></div>
        <div class="logo-tile"></div><div class="logo-tile"></div>
        <div class="logo-tile"></div><div class="logo-tile"></div>
        <div class="logo-tile"></div><div class="logo-tile"></div>
      </div>
    </div>

    <div class="title">连城</div>
    <div class="subtitle">LIAN CHENG · 一对即连</div>

    <div class="tap-hint">
      <span>👆</span> 轻触开始
    </div>
  </div>

  <!-- ====== 登录页 ====== -->
  <div class="screen-login hidden" id="login">
    <div class="login-box">
      <h2>✦ 连城 · 登录 ✦</h2>
      <input class="login-input" type="text"     placeholder="账号" id="username">
      <input class="login-input" type="password" placeholder="密码" id="password">
      <div class="login-row">
        <button class="login-btn btn-login">登录</button>
        <button class="login-btn btn-reg">注册</button>
      </div>
    </div>
  </div>

</div>

<script>
  const splash = document.getElementById('splash');
  const login  = document.getElementById('login');
  const game   = document.getElementById('app');

  // 轻触开屏 → 进入登录
  splash.addEventListener('click', (e) => {
    splash.classList.add('hidden');
    login.classList.remove('hidden');
  });

  // 登录/注册按钮（占位演示）
  document.querySelector('.btn-login').addEventListener('click', () => {
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();
    if (!u || !p) {
      alert('请输入账号和密码');
      return;
    }
    alert(`欢迎回来，${u}！\n（演示跳转游戏页面）`);
  });

  document.querySelector('.btn-reg').addEventListener('click', () => {
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();
    if (!u || !p) {
      alert('请输入账号和密码');
      return;
    }
    alert(`注册成功，${u}！\n（演示跳转游戏页面）`);
  });
</script>

</body>
</html>
