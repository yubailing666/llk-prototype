<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>哈基米消消乐 · 原型v3</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #5c4a3a; display: flex; justify-content: center; align-items: center; min-height: 100dvh; font-family: 'Press Start 2P', system-ui, monospace; overflow: hidden; image-rendering: pixelated; }

  .game { background: #8b7355; max-width: min(95vw, 420px); width: 100%; aspect-ratio: 9 / 16; border-radius: 8px; border: 3px solid #6b5b45; box-shadow: 0 0 0 5px #4a3d2e, 0 6px 24px rgba(0,0,0,0.5); position: relative; overflow: hidden; }

  .page { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.4s ease, transform 0.4s ease; z-index: 1; }
  .page.hidden { opacity: 0; transform: scale(1.03); pointer-events: none; z-index: 0; }

  /* ===== Splash ===== */
  #p-splash { background: linear-gradient(180deg,#b8a080,#8b7355 50%,#6b5b45); cursor: pointer; }
  .logo-g { width: 72px; height: 72px; display: grid; grid-template-columns: repeat(8,1fr); grid-template-rows: repeat(8,1fr); gap: 2px; margin-bottom: 14px; }
  .logo-g .px { border-radius: 1px; }
  .tt { font-size: 24px; color: #f5e6c8; text-shadow: 0 2px 0 #6b5b45; letter-spacing: 3px; margin-bottom: 2px; }
  .tt .hl { color: #e8c87a; text-shadow: 0 2px 0 #8b7355; }
  .sb { font-size: 7px; color: #c4b091; letter-spacing: 2px; margin-bottom: 30px; }
  .tap { font-size: 6px; color: #8a7a65; animation: blink 1.8s ease-in-out infinite; position: absolute; bottom: 36px; text-align: center; line-height: 1.6; }
  @keyframes blink { 0%,100%{opacity:0.3} 50%{opacity:1} }

  /* ===== Login ===== */
  #p-login { background: linear-gradient(180deg,#6b5b45,#5c4a3a); }
  .login-box { background: #5c4a3a; border-radius: 6px; padding: 24px 20px; width: min(82%,260px); border: 2px solid #7a6a55; position: relative; }
  .login-box::before { content:"😸"; position:absolute; top:-16px; left:50%; transform:translateX(-50%); font-size:22px; }
  .login-box h2 { color: #f5e6c8; font-size: 8px; text-align: center; margin-bottom: 14px; letter-spacing: 1px; }
  .login-i { width:100%; padding:8px 10px; margin-bottom:8px; background:#4a3d2e; border:2px solid #6b5b45; border-radius:3px; font-family:'Press Start 2P',monospace; font-size:7px; color:#f5e6c8; outline:none; }
  .login-i:focus { border-color:#e8c87a; }
  .login-i::placeholder { color:#7a6a55; }
  .login-r { display:flex; gap:6px; margin-top:4px; }
  .login-b { flex:1; padding:8px 0; border:none; border-radius:3px; font-family:'Press Start 2P',monospace; font-size:7px; color:#f5e6c8; cursor:pointer; box-shadow:inset 0 -2px 0 rgba(0,0,0,0.2); transition:0.06s; }
  .login-b:active { transform:translateY(2px); box-shadow:none; }
  .b-l { background:#8b7355; }
  .b-r { background:#6b5b45; }

  /* 给猫起名 */
  .name-box { margin-top:10px; padding:10px; background:#4a3d2e; border-radius:4px; text-align:center; }
  .name-box .nl { font-size:6px; color:#c4b091; margin-bottom:6px; }
  .name-box .ni { width:100%; padding:6px; border:2px solid #7a6a55; border-radius:3px; background:#5c4a3a; font-family:'Press Start 2P',monospace; font-size:7px; color:#f5e6c8; text-align:center; outline:none; }

  /* ===== Game ===== */
  #p-game { background: #6b5b45; padding: 6px; gap: 0; }

  /* StatusPanel — 4列 */
  .status { width:100%; display:grid; grid-template-columns:1.2fr 1fr 1.2fr 1fr; background:#5c4a3a; border-radius:4px; padding:4px 6px; min-height:48px; gap:2px; }
  .status .col { display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .status .col .l { font-size:6px; color:#a09070; }
  .status .col .v { font-size:12px; color:#f5e6c8; }
  .status .col .v.score { color:#e8c87a; font-size:14px; }
  .status .col .v.timer { color:#c4785a; }
  .status .col .v.used { color:#8a7a65; font-size:10px; }

  .combo-box { grid-column:1/-1; text-align:center; font-size:6px; color:#e8c87a; min-height:0; transition:0.2s; overflow:hidden; }
  .combo-box.show { min-height:16px; padding-top:2px; }

  /* Board */
  .b-wrap { flex:1; width:100%; display:flex; align-items:center; justify-content:center; position:relative; margin:4px 0; }
  .board { display:grid; grid-template-columns:repeat(6,1fr); gap:3px; width:94%; aspect-ratio:1; }
  .tile { aspect-ratio:1; border:2px solid #7a6a55; border-radius:2px; display:flex; align-items:center; justify-content:center; font-size:clamp(14px,4.5vw,22px); cursor:pointer; background:#d4c4a8; transition:0.06s; box-shadow:inset 0 -2px 0 rgba(0,0,0,0.12); }
  .tile:active { transform:scale(0.92); }
  .tile.sel { border-color:#e8c87a; box-shadow:0 0 0 3px #e8c87a, inset 0 -2px 0 rgba(0,0,0,0.12); }

  /* ControlPanel — Start + 重新开始 */
  .ctrl { width:100%; display:flex; gap:6px; padding:4px 0; }
  .ctrl .btn { flex:1; padding:10px 0; border:none; border-radius:3px; font-family:'Press Start 2P',monospace; font-size:7px; cursor:pointer; box-shadow:inset 0 -2px 0 rgba(0,0,0,0.2); transition:0.06s; }
  .ctrl .btn:active { transform:translateY(2px); box-shadow:none; }
  .ctrl .btn-start { background:#e8c87a; color:#4a3d2e; }
  .ctrl .btn-reset { background:#6b5b45; color:#c4b091; }

  /* ===== Settings ===== */
  #p-settings { background:#6b5b45; padding:24px 20px; justify-content:flex-start; padding-top:32px; }
  .stt { font-size:13px; color:#f5e6c8; text-shadow:0 2px 0 #5c4a3a; margin-bottom:16px; }
  .sg { width:100%; margin-bottom:14px; }
  .sl { font-size:7px; color:#c4b091; margin-bottom:5px; }
  .sr { display:flex; gap:5px; }
  .so { flex:1; padding:7px 0; border:2px solid #7a6a55; border-radius:3px; background:#5c4a3a; color:#a09070; text-align:center; font-family:'Press Start 2P',monospace; font-size:6px; cursor:pointer; transition:0.1s; }
  .so.active { border-color:#e8c87a; background:#4a3d2e; color:#e8c87a; }
  .ss { width:100%; -webkit-appearance:none; height:6px; background:#4a3d2e; border-radius:3px; outline:none; margin:8px 0; }
  .ss::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; background:#e8c87a; border-radius:2px; cursor:pointer; border:2px solid #c4b091; }
  .sh { font-size:5px; color:#8a7a65; }
  .sbtn { width:100%; padding:10px 0; border:none; border-radius:3px; font-family:'Press Start 2P',monospace; font-size:7px; color:#4a3d2e; cursor:pointer; background:#e8c87a; margin-top:6px; box-shadow:inset 0 -2px 0 #b89a50; }
  .sbtn:active { transform:translateY(2px); box-shadow:none; }
  .bbtn { width:100%; padding:8px 0; border:none; border-radius:3px; margin-top:6px; font-family:'Press Start 2P',monospace; font-size:6px; color:#c4b091; cursor:pointer; background:#4a3d2e; box-shadow:inset 0 -2px 0 #3d3025; }
  .bbtn:active { transform:translateY(2px); box-shadow:none; }
  .vi { font-size:5px; color:#8a7a65; margin-top:12px; }

  /* ===== Cattery ===== */
  #p-cat { background:#6b5b45; padding:20px 16px; justify-content:flex-start; padding-top:28px; }
  .ct { font-size:13px; color:#f5e6c8; text-shadow:0 2px 0 #5c4a3a; margin-bottom:2px; }
  .cs { font-size:5px; color:#8a7a65; margin-bottom:14px; }
  .cl { width:100%; display:flex; flex-direction:column; gap:7px; }
  .cc { display:flex; align-items:center; gap:10px; background:#5c4a3a; border-radius:4px; padding:10px; border:2px solid #7a6a55; }
  .cc:nth-child(1) { border-color:#e8c87a; }
  .cc:nth-child(2) { border-color:#b0a090; }
  .cc:nth-child(3) { border-color:#8a7a65; }
  .cc .rk { font-size:12px; width:22px; text-align:center; }
  .cc .ca { font-size:24px; transition:font-size 0.3s; }
  .cc .ci { flex:1; }
  .cc .ci .nm { font-size:6px; color:#f5e6c8; margin-bottom:1px; }
  .cc .ci .st { font-size:4px; color:#8a7a65; }
  .cc .ci .bw { margin-top:3px; height:3px; background:#4a3d2e; border-radius:2px; overflow:hidden; }
  .cc .ci .br { height:100%; background:#e8c87a; border-radius:2px; }

  /* ===== 钓鱼 ===== */
  .fo { position:absolute; inset:0; pointer-events:none; z-index:5; opacity:0; transition:opacity 0.3s; }
  .fo.a { opacity:1; }
  .w { position:absolute; bottom:0; left:0; right:0; height:28%; background:linear-gradient(180deg,transparent,#3a6b5c 40%,#2d5a4a); }
  .ws { position:absolute; bottom:28%; left:0; right:0; height:3px; background:#5a8a7a; opacity:0.4; border-radius:50%; }
  .fl { position:absolute; top:0; left:50%; width:1px; height:0; background:#a09070; transform:translateX(-50%); transition:height 0.5s ease; }
  .fl.d { height:46%; }
  .bb { position:absolute; top:0; left:50%; width:7px; height:7px; background:#c4785a; border-radius:50%; transform:translate(-50%,-50%); transition:top 0.5s ease; }
  .bb.d { top:46%; }
  .sp { position:absolute; bottom:28%; left:50%; width:0; height:0; border-radius:50%; border:2px solid rgba(255,255,255,0.3); transform:translate(-50%,50%); opacity:0; }
  .sp.a { width:30px; height:14px; opacity:1; transition:width 0.35s ease,height 0.35s ease,opacity 0.25s; }
  .fc { position:absolute; top:46%; left:50%; font-size:16px; transform:translate(-50%,-50%) scale(0); transition:transform 0.25s ease; }
  .fc.c { transform:translate(-50%,-50%) scale(1); }
  .fc.r { transition:top 0.4s ease,transform 0.25s ease; top:16%; }
  .fc.g { opacity:0; transition:opacity 0.15s; }
  .ft { position:absolute; top:36%; left:50%; font-size:6px; color:#e8c87a; transform:translate(-50%,-50%) scale(0); }
  .ft.s { transform:translate(-50%,-50%) scale(1); transition:transform 0.25s ease; }
  .ch { position:absolute; right:8%; bottom:3%; font-size:6px; color:#f5e6c8; opacity:0; transition:0.25s; }
  .ch.s { opacity:1; transform:translateY(-6px); transition:0.35s; }

  .cxs { font-size:14px; } .csm { font-size:18px; } .cmd { font-size:22px; } .clg { font-size:28px; } .cxl { font-size:34px; } .cxx { font-size:40px; }
</style>
</head>
<body>

<div class="game">

<!-- ===== Splash ===== -->
<div class="page" id="p-splash">
  <div class="logo-g" id="logoG"></div>
  <div class="tt">哈基米<br><span class="hl">消消乐</span></div>
  <div class="sb">找到一对 · 喂饱小猫</div>
  <div class="tap">👆 随便点一下<br><span style="font-size:4px">带你的猫回家</span></div>
</div>

<!-- ===== Login + 给猫起名 ===== -->
<div class="page hidden" id="p-login">
  <div class="login-box">
    <h2>✦ 欢迎来到猫岛 ✦</h2>
    <input class="login-i" type="text" placeholder="账号" id="uid">
    <input class="login-i" type="password" placeholder="密码" id="pwd">
    <div class="login-r">
      <button class="login-b b-l" id="btnL">进猫窝</button>
      <button class="login-b b-r" id="btnR">新猫入住</button>
    </div>
    <div class="name-box">
      <div class="nl">🐱 给你的小猫起个名字吧</div>
      <input class="ni" type="text" placeholder="输入名字..." id="catName" value="咪咪">
    </div>
  </div>
</div>

<!-- ===== Game ===== -->
<div class="page hidden" id="p-game">
  <!-- StatusPanel：4列 -->
  <div class="status">
    <div class="col">
      <span class="l">分数</span>
      <span class="v score" id="sc">0</span>
    </div>
    <div class="col">
      <span class="l">剩余时间</span>
      <span class="v timer" id="tm">00:00</span>
    </div>
    <div class="col">
      <span class="l" id="prLbl">剩余可消除</span>
      <span class="v" id="pr" style="font-size:9px">0对</span>
    </div>
    <div class="col">
      <span class="l">已经用时</span>
      <span class="v used" id="ut">00:00</span>
    </div>
    <div class="combo-box" id="cbox"></div>
  </div>

  <div class="b-wrap">
    <div class="board" id="board"></div>
    <!-- 钓鱼动画 -->
    <div class="fo" id="fo">
      <div class="w"></div><div class="ws"></div>
      <div class="fl" id="fl"></div><div class="bb" id="bbob"></div>
      <div class="sp" id="spr"></div>
      <div class="fc" id="fc">🐟</div>
      <div class="ft" id="ft">😸 好吃！</div>
      <div class="ch" id="ch">呼噜呼噜~</div>
    </div>
  </div>

  <!-- ControlPanel：Start + 重新开始 + 设置 + 猫舍 -->
  <div class="ctrl">
    <button class="btn btn-start" id="bStart" style="flex:1.2">▶ START</button>
    <button class="btn btn-reset" id="bReset">↺ 重开</button>
  </div>
  <div class="ctrl" style="margin-top:-2px">
    <button class="btn" style="background:#5c4a3a;color:#a09070;font-size:6px" id="bHint">💡 提示</button>
    <button class="btn" style="background:#5c4a3a;color:#a09070;font-size:6px" id="bToSet">⚙ 设置</button>
    <button class="btn" style="background:#5c4a3a;color:#a09070;font-size:6px" id="bToCat">🏠 猫舍</button>
  </div>
</div>

<!-- ===== Settings ===== -->
<div class="page hidden" id="p-settings">
  <div class="stt">⚙ 设置</div>
  <div class="sg">
    <div class="sl">⏱ 时间限制</div>
    <div class="sr" id="tOpts">
      <div class="so" data-v="60">60s</div>
      <div class="so active" data-v="120">120s</div>
      <div class="so" data-v="180">180s</div>
      <div class="so" data-v="-1">∞</div>
    </div>
  </div>
  <div class="sg">
    <div class="sl">🎯 难度</div>
    <input type="range" class="ss" id="ds" min="3" max="6" value="4" step="1">
    <div class="sh" id="dh">中等 · 4×4 网格</div>
  </div>
  <div class="sg">
    <div class="sl">🔊 音效</div>
    <div class="sr" id="sOpts">
      <div class="so active">开</div>
      <div class="so">关</div>
    </div>
  </div>
  <button class="sbtn">🔄 重新开始</button>
  <button class="bbtn" id="bBackSet">↩ 返回游戏</button>
  <div class="vi">🀄 哈基米消消乐 v1.0 · Java Swing</div>
</div>

<!-- ===== Cattery ===== -->
<div class="page hidden" id="p-cat">
  <div class="ct">🏠 猫舍</div>
  <div class="cs">猫越肥越厉害</div>
  <div class="cl" id="catList"></div>
  <button class="bbtn" id="bBackCat" style="margin-top:14px">↩ 回去钓鱼</button>
</div>

</div>

<script>
// ===== 猫爪 =====
const lg=document.getElementById('logoG');
for(let i=0;i<64;i++){const px=document.createElement('div');px.className='px';lg.appendChild(px)}
const pa=[27,28,35,36,5,6,13,14,9,10,17,18,11,12,19,20,41,42,49,50,45,46,53,54];
const de=[2,7,15,22,23,30,31,38,39,58,61];
const ap=lg.querySelectorAll('.px');
pa.forEach(i=>ap[i].style.background='#e8dcc0');
de.forEach(i=>{if(ap[i])ap[i].style.background='#c4b091'});

// ===== 状态 =====
const EM=['🍣','🍙','🥟','🧁','🍩','🍪','🥕','🧀','🍎','🍤','🥚','🍇'];
const R=6,C=6; let board=[],sel=null,score=0,clv=1,ff=0,gameRunning=false;
const csz=['🐱','🐱','🐈','🐈','🐅','🐅','🐱‍👤','🐱‍👤','🦁','🦁'];
const cln=['小奶猫','小奶猫','肥猫','肥猫','大胖猫','小老虎','小老虎','虎王','狮王','猫中之神'];
let catName='咪咪';

function gb(){const t=R*C,p=[];for(let i=0;i<t/2;i++)p.push(EM[i%EM.length],EM[i%EM.length]);for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}return p.map((e,i)=>({emoji:e,rm:false}))}

function rb(){
  const el=document.getElementById('board');el.innerHTML='';
  board.forEach((c,i)=>{
    const d=document.createElement('div');d.className='tile';d.dataset.i=i;
    if(c.rm){d.style.visibility='hidden';d.style.pointerEvents='none'}
    if(sel===i)d.classList.add('sel');
    d.textContent=c.rm?'':c.emoji;
    d.addEventListener('click',()=>ht(i));
    el.appendChild(d);
  });
  const cnt=board.filter(c=>!c.rm).length;
  document.getElementById('pr').textContent=cnt/2+'对';
}

function ht(i){
  if(!gameRunning||board[i].rm)return;
  if(sel===null){sel=i;rb();return}
  if(sel===i){sel=null;rb();return}
  const a=board[sel],b=board[i];
  if(a.emoji===b.emoji){a.rm=true;b.rm=true;sel=null;rb();fsh()}
  else{sel=null;rb()}
}

// ===== 钓鱼 =====
function fsh(){
  const o=document.getElementById('fo'),fl=document.getElementById('fl'),bb=document.getElementById('bbob'),
      sp=document.getElementById('spr'),fc=document.getElementById('fc'),ft=document.getElementById('ft'),
      ch=document.getElementById('ch');
  o.classList.add('a');
  setTimeout(()=>{fl.classList.add('d');bb.classList.add('d')},80);
  setTimeout(()=>sp.classList.add('a'),500);
  setTimeout(()=>{sp.classList.remove('a');fc.classList.add('c');fc.textContent=['🐟','🐠','🐡','🦐','🦀','🐙'][Math.floor(Math.random()*6)]},900);
  setTimeout(()=>{fc.classList.add('r');fl.classList.remove('d');bb.classList.remove('d')},1300);
  setTimeout(()=>{fc.classList.add('g');ft.classList.add('s');score+=100;ff++;const ol=clv;clv=Math.min(10,1+Math.floor(ff/3));ui();const ci=document.getElementById('gci');if(ci){ci.style.transform='scale(1.2)';setTimeout(()=>ci.style.transform='scale(1)',200)}},1800);
  setTimeout(()=>{ft.classList.remove('s');ch.classList.add('s');ch.textContent=['😸 好吃！','😻 鱼！','😽 还要~','🐈 呼噜'][Math.floor(Math.random()*4)]},2200);
  setTimeout(()=>{ch.classList.remove('s');o.classList.remove('a');fl.classList.remove('d');bb.classList.remove('d');fc.classList.remove('c','r','g');ft.classList.remove('s')},3000);
  // combo
  document.getElementById('cbox').textContent='🔥 连击 x1！';
  document.getElementById('cbox').classList.add('show');
  setTimeout(()=>document.getElementById('cbox').classList.remove('show'),2500);
}

function ui(){
  const sz=clv<=2?'cxs':clv<=4?'csm':clv<=5?'cmd':clv<=7?'clg':clv<=9?'cxl':'cxx';
  // update status
}

// ===== 页面切换 =====
document.getElementById('p-splash').addEventListener('click',()=>{
  document.getElementById('p-splash').classList.add('hidden');
  document.getElementById('p-login').classList.remove('hidden');
});

// 登录
document.getElementById('btnL').addEventListener('click',()=>{
  const u=document.getElementById('uid').value.trim();
  if(!u){alert('请输入账号 😸');return}
  catName=document.getElementById('catName').value.trim()||'咪咪';
  document.getElementById('p-login').classList.add('hidden');
  document.getElementById('p-game').classList.remove('hidden');
});
document.getElementById('btnR').addEventListener('click',()=>{
  const u=document.getElementById('uid').value.trim();
  if(!u){alert('请输入账号 😸');return}
  catName=document.getElementById('catName').value.trim()||'咪咪';
  document.getElementById('p-login').classList.add('hidden');
  document.getElementById('p-game').classList.remove('hidden');
});

// Start
document.getElementById('bStart').addEventListener('click',()=>{
  gameRunning=true;
  board=gb();sel=null;rb();
  document.getElementById('tm').textContent='01:00';
  document.getElementById('ut').textContent='00:00';
  // Start后的start按钮可以变成灰色
});

document.getElementById('bReset').addEventListener('click',()=>{
  if(!gameRunning){board=gb();sel=null;rb();return}
  board=gb();sel=null;rb();score=0;ff=0;clv=1;
  ui();
});

// 设置按钮
const game=document.getElementById('p-game'),setP=document.getElementById('p-settings'),catP=document.getElementById('p-cat');
document.getElementById('bToSet').addEventListener('click',()=>{game.classList.add('hidden');setP.classList.remove('hidden')});
document.getElementById('bToCat').addEventListener('click',oc);
// 猫舍
function oc(){
  document.getElementById('p-game').classList.add('hidden');
  document.getElementById('p-cat').classList.remove('hidden');
  const ls=document.getElementById('catList');ls.innerHTML='';
  const cats=[{name:catName,level:clv,fish:ff,score:score},
    {name:'胖虎',level:Math.min(10,clv+Math.floor(Math.random()*3)),fish:ff+Math.floor(Math.random()*10),score:score+Math.floor(Math.random()*1000)},
    {name:'大橘',level:Math.min(10,clv+Math.floor(Math.random()*4)-1),fish:ff+Math.floor(Math.random()*8),score:score+Math.floor(Math.random()*800)-300}]
    .sort((a,b)=>b.score-a.score);
  cats.forEach((c,i)=>{
    const s=c.level<=2?'cxs':c.level<=4?'csm':c.level<=5?'cmd':c.level<=7?'clg':c.level<=9?'cxl':'cxx';
    const card=document.createElement('div');card.className='cc';
    const md=['🥇','🥈','🥉'];
    card.innerHTML=`<div class="rk">${i<3?md[i]:'#'+(i+1)}</div><div class="ca ${s}">${csz[c.level-1]||'🐱'}</div><div class="ci"><div class="nm">${c.name}</div><div class="st">Lv.${c.level} · 🐟${c.fish}条 · ${c.score}分</div><div class="bw"><div class="br" style="width:${c.level*10}%"></div></div></div>`;
    ls.appendChild(card);
  });
}
